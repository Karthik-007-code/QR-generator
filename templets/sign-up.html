<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up &mdash; QR Generator</title>
  <meta name="description"
    content="Create your QR Code Generator account to design, customize, and track dynamic QR codes." />

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet" />

  <style>
    /* ============================================================
       Design System & Variables
       Palette:
         - #5D7B6F (Deep Sage / Primary Brand)
         - #A4C3A2 (Moss Green / Secondary Accent)
         - #B0D4B8 (Celadon Mint / Focus & Highlight)
         - #EAE7D6 (Warm Linen Cream / Surface Base)
         - #D7F9FA (Ice Aqua Tint / Ambient Glow)
       ============================================================ */
    :root {
      --color-primary: #5D7B6F;
      --color-primary-dark: #4b645a;
      --color-primary-light: #709385;
      --color-secondary: #A4C3A2;
      --color-mint: #B0D4B8;
      --color-cream: #EAE7D6;
      --color-cream-soft: #f4f2e6;
      --color-ice: #D7F9FA;

      --text-main: #273832;
      --text-muted: #5d746b;
      --text-light: #7a9188;

      --card-bg: rgba(244, 242, 230, 0.85);
      --card-border: rgba(176, 212, 184, 0.65);
      --card-shadow: 0 24px 60px -12px rgba(93, 123, 111, 0.22),
        0 12px 24px -8px rgba(93, 123, 111, 0.12);

      --input-bg: rgba(255, 255, 255, 0.88);
      --input-border: #B0D4B8;
      --input-focus-ring: rgba(93, 123, 111, 0.25);

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 20px;
      --radius-full: 9999px;

      --transition-standard: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* CSS Reset & Base */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--text-main);
      background-color: var(--color-ice);
      background-image:
        radial-gradient(at 0% 0%, var(--color-ice) 0px, transparent 55%),
        radial-gradient(at 100% 0%, var(--color-mint) 0px, transparent 50%),
        radial-gradient(at 100% 100%, var(--color-secondary) 0px, transparent 50%),
        radial-gradient(at 0% 100%, var(--color-cream) 0px, transparent 50%);
      background-attachment: fixed;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      position: relative;
      overflow-x: hidden;
      accent-color: var(--color-primary);
    }

    /* Ambient Background Blobs */
    .bg-blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
      pointer-events: none;
      opacity: 0.6;
      animation: float 14s ease-in-out infinite alternate;
    }

    .bg-blob-1 {
      width: 440px;
      height: 440px;
      background: var(--color-cream);
      top: -100px;
      left: -80px;
    }

    .bg-blob-2 {
      width: 500px;
      height: 500px;
      background: var(--color-secondary);
      bottom: -120px;
      right: -100px;
      animation-delay: -5s;
    }

    .bg-blob-3 {
      width: 340px;
      height: 340px;
      background: var(--color-mint);
      top: 45%;
      left: 70%;
      transform: translate(-50%, -50%);
      opacity: 0.45;
      animation-delay: -9s;
    }

    @keyframes float {
      0% {
        transform: translate(0, 0) scale(1);
      }

      100% {
        transform: translate(25px, 20px) scale(1.08);
      }
    }

    /* Main Container */
    .signup-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      margin: auto;
    }

    .signup-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 36px 34px;
      box-shadow: var(--card-shadow);
      transition: var(--transition-standard);
    }

    /* Header */
    .card-header {
      text-align: center;
      margin-bottom: 26px;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 58px;
      height: 58px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--color-primary), var(--color-secondary));
      color: #ffffff;
      box-shadow: 0 8px 20px -4px rgba(93, 123, 111, 0.4);
      margin-bottom: 16px;
      transition: var(--transition-standard);
    }

    .brand-badge:hover {
      transform: translateY(-2px) rotate(-4deg);
      box-shadow: 0 12px 24px -4px rgba(93, 123, 111, 0.5);
    }

    .brand-badge svg {
      width: 30px;
      height: 30px;
      fill: currentColor;
    }

    .card-title {
      font-size: 1.7rem;
      font-weight: 700;
      color: var(--color-primary);
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    .card-subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* Form Layout */
    .form-group {
      margin-bottom: 18px;
      position: relative;
    }

    .form-label {
      display: block;
      font-size: 0.835rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 7px;
      letter-spacing: 0.01em;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      width: 18px;
      height: 18px;
      color: var(--color-primary);
      opacity: 0.75;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition-standard);
    }

    .form-input {
      width: 100%;
      height: 46px;
      padding: 0 16px 0 44px;
      font-family: inherit;
      font-size: 0.935rem;
      color: var(--text-main);
      background: var(--input-bg);
      border: 1.5px solid var(--input-border);
      border-radius: var(--radius-md);
      outline: none;
      transition: var(--transition-standard);
    }

    .form-input::placeholder {
      color: var(--text-light);
      font-size: 0.875rem;
    }

    .form-input:hover {
      border-color: var(--color-secondary);
    }

    .form-input:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 4px var(--input-focus-ring);
      background: #ffffff;
    }

    .input-wrapper:focus-within .input-icon {
      color: var(--color-primary);
      opacity: 1;
      transform: scale(1.08);
    }

    /* Password Toggle */
    .password-toggle {
      position: absolute;
      right: 12px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-sm);
      transition: var(--transition-standard);
    }

    .password-toggle:hover {
      color: var(--color-primary);
      background: rgba(164, 195, 162, 0.2);
    }

    .password-toggle svg {
      width: 18px;
      height: 18px;
    }

    /* Validation Feedback Message */
    .match-status {
      font-size: 0.775rem;
      margin-top: 6px;
      display: none;
      align-items: center;
      gap: 4px;
    }

    .match-status.mismatch {
      display: flex;
      color: #c94a29;
    }

    .match-status.matched {
      display: flex;
      color: var(--color-primary-dark);
    }

    /* Submit Button */
    .submit-btn {
      margin-top: 8px;
      width: 100%;
      height: 48px;
      background: var(--color-primary);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-md);
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(93, 123, 111, 0.35);
      transition: var(--transition-standard);
    }

    .submit-btn:hover {
      background: var(--color-primary-dark);
      box-shadow: 0 6px 20px rgba(93, 123, 111, 0.45);
      transform: translateY(-1px);
    }

    .submit-btn:active {
      transform: translateY(1px);
      box-shadow: 0 2px 8px rgba(93, 123, 111, 0.3);
    }

    .submit-btn svg {
      width: 18px;
      height: 18px;
      transition: transform 0.2s ease;
    }

    .submit-btn:hover svg {
      transform: translateX(3px);
    }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      margin: 24px 0;
      color: var(--text-light);
      font-size: 0.775rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--color-mint);
      opacity: 0.7;
    }

    .divider span {
      padding: 0 12px;
    }

    /* Social Action Buttons */
    .social-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .social-btn {
      height: 44px;
      background: #ffffff;
      border: 1px solid var(--color-mint);
      border-radius: var(--radius-md);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
      text-decoration: none;
      transition: var(--transition-standard);
    }

    .social-btn:hover {
      background: var(--color-cream-soft);
      border-color: var(--color-secondary);
      transform: translateY(-1px);
    }

    .social-btn svg {
      width: 18px;
      height: 18px;
    }

    /* Card Footer */
    .card-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .card-footer a {
      color: var(--color-primary);
      text-decoration: none;
      font-weight: 600;
      transition: var(--transition-standard);
    }

    .card-footer a:hover {
      color: var(--color-primary-dark);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--color-primary);
      color: #ffffff;
      padding: 12px 20px;
      border-radius: var(--radius-md);
      font-size: 0.9rem;
      font-weight: 500;
      box-shadow: 0 10px 25px -5px rgba(93, 123, 111, 0.4);
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0;
      transform: translateY(20px);
      pointer-events: none;
      transition: var(--transition-standard);
      z-index: 100;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    /* Mobile Responsive */
    @media (max-width: 480px) {
      body {
        padding: 16px;
      }

      .signup-card {
        padding: 28px 20px;
      }

      .card-title {
        font-size: 1.45rem;
      }

      .social-actions {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <!-- Ambient background elements -->
  <div class="bg-blob bg-blob-1" aria-hidden="true"></div>
  <div class="bg-blob bg-blob-2" aria-hidden="true"></div>
  <div class="bg-blob bg-blob-3" aria-hidden="true"></div>

  <main class="signup-container">
    <div class="signup-card">
      <!-- Card Header -->
      <header class="card-header">
        <div class="brand-badge" aria-label="QR Generator Logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
            <line x1="7" y1="7" x2="7" y2="7"></line>
            <line x1="17" y1="7" x2="17" y2="7"></line>
            <line x1="7" y1="17" x2="7" y2="17"></line>
            <line x1="17" y1="17" x2="17" y2="17"></line>
          </svg>
        </div>
        <h1 class="card-title">Create Account</h1>
        <p class="card-subtitle">Start generating custom QR codes in seconds</p>
      {% if error %}
      <div style="background-color: #fee2e2; border: 1px solid #f87171; color: #991b1b; padding: 12px 16px; border-radius: var(--radius-md); margin-bottom: 20px; font-size: 0.9rem; text-align: center;">
        {{ error }}
      </div>
      {% endif %}

      <!-- Sign Up Form -->
      <form id="signupForm" method="POST" action="/signup" novalidate>
        <!-- Full Name -->
        <div class="form-group">
          <label class="form-label" for="fullName">Full Name</label>
          <div class="input-wrapper">
            <span class="input-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </span>
            <input type="text" id="fullName" name="fullname" class="form-input" placeholder="Alex Johnson" value="{{ fullname if fullname else '' }}" required
              autocomplete="name" />
          </div>
        </div>

        <!-- Email -->
        <div class="form-group">
          <label class="form-label" for="signupEmail">Email Address</label>
          <div class="input-wrapper">
            <span class="input-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
              </svg>
            </span>
            <input type="email" id="signupEmail" name="email" class="form-input" placeholder="alex@example.com" value="{{ email if email else '' }}" required
              autocomplete="email" />
          </div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label class="form-label" for="signupPassword">Password</label>
          <div class="input-wrapper">
            <span class="input-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
            <input type="password" id="signupPassword" name="password" class="form-input"
              placeholder="Create a strong password" required autocomplete="new-password" />
            <button type="button" id="togglePassword" class="password-toggle" aria-label="Show password"
              title="Show password">
              <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirm Password</label>
          <div class="input-wrapper">
            <span class="input-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
              </svg>
            </span>
            <input type="password" id="confirmPassword" name="confirm_password" class="form-input"
              placeholder="Repeat your password" required autocomplete="new-password" />
          </div>
          <p id="matchStatus" class="match-status" role="alert"></p>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="submitBtn" class="submit-btn">
          <span>Create Account</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </form>

      <!-- Alternative Registration -->
      <div class="divider">
        <span>or sign up with</span>
      </div>

      <div class="social-actions">
        <button type="button" class="social-btn" id="googleBtn" aria-label="Sign up with Google">
          <svg viewBox="0 0 24 24">
            <path fill="#4285F4"
              d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z" />
            <path fill="#34A853"
              d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.34 24 12 24z" />
            <path fill="#FBBC05"
              d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15z" />
            <path fill="#EA4335"
              d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.34 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z" />
          </svg>
          <span>Google</span>
        </button>
        <button type="button" class="social-btn" id="githubBtn" aria-label="Sign up with GitHub">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path fill-rule="evenodd" clip-rule="evenodd"
              d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" />
          </svg>
          <span>GitHub</span>
        </button>
      </div>

      <!-- Footer Info -->
      <footer class="card-footer">
        <p>Already have an account? <a href="http://127.0.0.1:8000/login">Sign in here</a></p>
      </footer>
    </div>
  </main>

  <!-- Interactive Feedback Toast -->
  <div id="toast" class="toast" role="status" aria-live="polite">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
      <polyline points="22 4 12 14.01 9 11.01"></polyline>
    </svg>
    <span id="toastMsg">Account created successfully!</span>
  </div>

  <script>
    // Password visibility toggle logic
    const toggleBtn = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('signupPassword');
    const confirmInput = document.getElementById('confirmPassword');
    const eyeIcon = document.getElementById('eyeIcon');

    toggleBtn.addEventListener('click', () => {
      const isPassword = passwordInput.getAttribute('type') === 'password';
      passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
      toggleBtn.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
      toggleBtn.setAttribute('title', isPassword ? 'Hide password' : 'Show password');

      if (isPassword) {
        eyeIcon.innerHTML = `
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
          <line x1="1" y1="1" x2="23" y2="23"></line>
        `;
      } else {
        eyeIcon.innerHTML = `
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        `;
      }
    });

    // Password match check
    passwordInput.addEventListener('input', checkPasswordMatch);

    const matchStatus = document.getElementById('matchStatus');
    function checkPasswordMatch() {
      const p1 = passwordInput.value;
      const p2 = confirmInput.value;

      if (!p2) {
        matchStatus.className = 'match-status';
        matchStatus.textContent = '';
        return;
      }

      if (p1 === p2) {
        matchStatus.className = 'match-status matched';
        matchStatus.innerHTML = `
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          Passwords match
        `;
      } else {
        matchStatus.className = 'match-status mismatch';
        matchStatus.innerHTML = `
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          Passwords do not match
        `;
      }
    }

    confirmInput.addEventListener('input', checkPasswordMatch);

    // Form interactive submission
    const signupForm = document.getElementById('signupForm');
    const toast = document.getElementById('toast');
    const toastMsg = document.getElementById('toastMsg');

    function showToast(message) {
      toastMsg.textContent = message;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 3500);
    }

    signupForm.addEventListener('submit', (e) => {
      const name = document.getElementById('fullName').value.trim();
      const email = document.getElementById('signupEmail').value.trim();
      const p1 = passwordInput.value;
      const p2 = confirmInput.value;

      if (!name || !email || !p1 || !p2) {
        e.preventDefault();
        showToast('Please fill in all required fields.');
        return;
      }

      if (p1 !== p2) {
        e.preventDefault();
        showToast('Passwords do not match.');
        return;
      }

      if (window.location.protocol === 'file:') {
        e.preventDefault();
        showToast('Demo account registered successfully! Redirecting to login...');
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 1500);
      }
    });
  </script>
</body>

</html>
